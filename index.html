  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technical Summaries</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 3rem 1.5rem;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }
    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .doc-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .doc-card {
      display: block;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }
    .doc-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }
    .doc-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }
    .doc-desc {
      font-size: 0.92rem;
      color: var(--muted);
    }
    .doc-meta {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Technical Summaries</h1>
      <p>연구 및 모델링 기술 요약 문서 목록</p>
    </header>

    <main class="doc-list">
      <a class="doc-card" href="Copula_BN_summary.html">
        <div class="doc-title">Copula-based Bayesian Networks Summary</div>

        <div class="doc-meta">Copula_BN_summary.html</div>
      </a>
